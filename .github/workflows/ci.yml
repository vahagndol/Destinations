name: .NET CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Destinations.sln

      - name: Build
        run: dotnet build Destinations.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test Destinations.sln --no-build --configuration Release --verbosity normal
