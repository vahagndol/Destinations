name: .NET CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Destinations.sln

      - name: Build
        run: dotnet build Destinations.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test Destinations.sln --no-build --configuration Release --verbosity normal

  # The Vue SPA builds independently of the .NET solution (see src/Application/Application.csproj),
  # so it gets its own job rather than gating build-and-test.
  build-clientapp:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: src/Application/ClientApp

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: src/Application/ClientApp/package-lock.json

      - name: Install
        run: npm ci

      - name: Type-check and build
        run: npm run build
